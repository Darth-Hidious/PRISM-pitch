<!doctype html>

<div id="root"></div>
<script>

  h(P.ObjectCard,{type:'Module · Mutator fleet',title:'Generative samplers',properties:[['Does','Explores composition space'],['How','Thermodynamically conditioned']],state:'computable'}),
  h(P.ObjectCard,{type:'Module · MKG',title:'Materials knowledge graph',emphasis:true,properties:[['Does','Holds what is known'],['How','Literature, patents, instrument data']]})))
  );
</script>
