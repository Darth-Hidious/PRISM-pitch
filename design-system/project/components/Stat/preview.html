<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stat — preview</title>
<style>
  body { margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 20px 24px; }
  .pad { padding: 24px; }
  .pm-numeral{font-size:56px}
</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.Prism, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',{className:'pad'},h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:24}},
  h(P.Stat,{size:'lg',value:'474M',label:'Possible alloys from five of nine metals'}),
  h(P.Stat,{size:'lg',value:'10',label:'Alloys a fast lab makes in a day'}),
  h(P.Stat,{size:'lg',value:'130,000',label:'Years to make each one once'}),
  h(P.Stat,{size:'lg',value:h('span',{style:{color:'var(--crimson)'}},'1'),label:'Loop that chooses which few to make'})))
  );
</script>
</body>
</html>
