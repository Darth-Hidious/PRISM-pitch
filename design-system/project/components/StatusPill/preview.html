<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StatusPill — preview</title>
<style>
  body { margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 20px 24px; }
  .pad { padding: 24px; }
  
</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.Prism, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',null,
  h('div',{className:'row'},h(P.StatusPill,{tone:'accent'},'Active'),h(P.StatusPill,{tone:'accent'},'Awarded'),h(P.StatusPill,{tone:'teal'},'Contracted'),h(P.StatusPill,{tone:'crimson'},'Interest'),h(P.StatusPill,{tone:'neutral'},'Next')),
  h('div',{className:'row','data-theme':'navy'},h(P.StatusPill,{tone:'accent'},'Awarded'),h(P.StatusPill,{tone:'teal'},'Contracted'),h(P.StatusPill,{tone:'crimson'},'Interest'),h(P.StatusPill,{tone:'neutral'},'Next')))
  );
</script>
</body>
</html>
