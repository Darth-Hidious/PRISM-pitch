<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<style>
  body { margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 20px 24px; }
  .pad { padding: 24px; }
  
</style>
</head>
<body>
<div id="root"></div>
<script>
  var P = window.Prism, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div',null,
  h('div',{className:'row'},h(P.Button,{href:'#',external:true},'Register interest'),h(P.Button,{variant:'secondary',href:'#'},'See the platform'),h(P.Button,{variant:'link',href:'#'},'Investor briefing')),
  h('div',{className:'row','data-theme':'navy'},h(P.Button,{href:'#',external:true},'Register interest'),h(P.Button,{variant:'secondary',href:'#'},'Read the investor briefing')))
  );
</script>
