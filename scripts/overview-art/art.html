<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="2400" height="1200"></canvas>
<script>
// Renders one abstract background per step of the PRISM loop.
// Select with ?art=design|make|qualify. Deterministic: fixed time value.
const art = new URLSearchParams(location.search).get('art') || 'design';

const common = `
precision highp float;
uniform vec2 uRes;
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<6;i++){ v+=a*noise(p); p=m*p; a*=.5; } return v; }
vec3 grade(vec3 c){ return pow(c, vec3(0.9)); }
`;

const shaders = {
  // Crystal lattice seen in perspective, points and bonds fading into haze.
  design: `
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*uRes)/uRes.y;
    vec3 col = vec3(.006,.010,.024);
    col += vec3(.05,.09,.20) * pow(fbm(uv*1.3 + 3.), 1.5) * 1.6;
    for (int layer = 0; layer < 6; layer++) {
      float z = 1. + float(layer)*.75;
      vec2 p = uv * (4.5 * z) + vec2(float(layer)*1.7, float(layer)*.9);
      p = mat2(.94,-.34,.34,.94) * p;
      p += .08*vec2(noise(p*.5), noise(p*.5+7.));
      vec2 cell = fract(p) - .5;
      float blur = .015 + .03*float(layer);
      float size = .09 / z;
      float atom = smoothstep(size + blur, size*.2, length(cell));
      float bondX = smoothstep(.012 + blur*.5, 0., abs(cell.y)) * step(abs(cell.x), .5);
      float bondY = smoothstep(.012 + blur*.5, 0., abs(cell.x)) * step(abs(cell.y), .5);
      float h = hash(floor(p));
      float fade = 1.1 / (z*z) * (.35 + .65*fbm(uv*2. + float(layer)));
      vec3 tint = mix(vec3(.55,.75,1.), vec3(1.,.82,.5), step(.95, h));
      col += tint * (atom*(.6 + 1.2*h) + (bondX+bondY)*.12) * fade;
    }
    col *= smoothstep(1.9, .25, length(uv*vec2(.55,1.)));
    gl_FragColor = vec4(grade(col), 1.);
  }`,
  // Molten flow: warm, domain-warped noise like a melt pool under a lens.
  make: `
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*uRes)/uRes.y;
    vec2 q = vec2(fbm(uv*1.8), fbm(uv*1.8 + 5.2));
    vec2 r = vec2(fbm(uv*1.8 + 3.*q + vec2(1.7,9.2)), fbm(uv*1.8 + 3.*q + vec2(8.3,2.8)));
    float f = fbm(uv*1.8 + 3.*r);
    vec3 col = vec3(.02,.01,.008);
    col = mix(col, vec3(.35,.08,.02), smoothstep(.35,.6,f));
    col = mix(col, vec3(.95,.45,.10), smoothstep(.55,.75,f));
    col = mix(col, vec3(1.,.86,.55), smoothstep(.72,.9,f));
    col *= .55 + .7*smoothstep(1.6, .1, length((uv - vec2(.2,-.05))*vec2(.6,1.)));
    gl_FragColor = vec4(grade(col), 1.);
  }`,
  // Powder diffraction: concentric Debye rings with grain speckle.
  qualify: `
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*uRes)/uRes.y;
    vec2 c = uv - vec2(-.62, -.12);
    float r = length(c);
    float a = atan(c.y, c.x);
    vec3 col = vec3(.006,.012,.018);
    float rings = 0.;
    float radii[7];
    radii[0]=.18; radii[1]=.27; radii[2]=.33; radii[3]=.46; radii[4]=.58; radii[5]=.71; radii[6]=.86;
    for (int i = 0; i < 7; i++) {
      float w = .004 + .002*float(i);
      float ring = smoothstep(w, 0., abs(r - radii[i]));
      float grain = .55 + .45*noise(vec2(a*60., float(i)*13.));
      rings += ring * grain * (1.1 - float(i)*.1);
    }
    col += vec3(.55,.9,.95) * rings;
    col += vec3(.04,.10,.14) * smoothstep(.9, 0., r);
    col += vec3(.9,1.,1.) * smoothstep(.05, 0., r) * .8;
    col *= smoothstep(2.2, .3, length(uv*vec2(.6,1.)));
    gl_FragColor = vec4(grade(col), 1.);
  }`,
};

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, common + shaders[art]));
gl.linkProgram(prog); gl.useProgram(prog);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), canvas.width, canvas.height);
gl.viewport(0, 0, canvas.width, canvas.height);
gl.drawArrays(gl.TRIANGLES, 0, 3);
document.title = 'done';
</script>
</body>
</html>
